aid: filmhub
name: Filmhub
description: >-
  Filmhub is a global film and television sales and distribution company that
  operates a self-service marketplace connecting independent filmmakers and
  rights holders directly to more than 100 streaming channels and platforms
  worldwide, including Tubi, Plex, Xumo, Amazon, Fandor, and others across AVOD,
  SVOD, TVOD, and FAST business models. Founded in 2017 and headquartered in Los
  Angeles, Filmhub charges no upfront listing fees and instead earns a 20 percent
  share of the royalties generated by the distribution deals it facilitates.
  Filmmakers upload their titles, technical specifications, and metadata to the
  Filmhub app; channel partners browse the catalog and license the content they
  want; and Filmhub manages technical delivery, revenue collection, and
  reporting. The company is backed by a16z and other investors. Filmhub does not
  publish a public developer API, developer portal, or OpenAPI definition; this
  profile captures its public identity and web properties.
